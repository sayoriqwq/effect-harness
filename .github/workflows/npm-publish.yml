name: Publish npm package

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @sayoriqwq/effect-harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: effect-harness

    steps:
      - name: Checkout Effect Harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: effect-harness

      - name: Checkout Prelude Control Handoff Gate Baseline
        uses: actions/checkout@v4
        with:
          repository: yume-infra/prelude
          ref: 071e317697684dd26922d79ee47cbd9d9878069a
          path: prelude

      - name: Checkout Partita 0.2.2 Baseline
        uses: actions/checkout@v4
        with:
          repository: sayoriqwq/partita
          ref: df7b400b5d4c2fc21175d450a589f153be401485
          path: partita

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: |
            effect-harness/pnpm-lock.yaml
            prelude/pnpm-lock.yaml
            partita/pnpm-lock.yaml

      - name: Install Effect Harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Prelude dependencies
        run: pnpm --dir ../prelude install --frozen-lockfile

      - name: Install Partita dependencies
        run: pnpm --dir ../partita install --frozen-lockfile

      - name: Reject an already published package version
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published" >&2
            exit 1
          fi

      - name: Run release-level cross-repository acceptance
        run: pnpm acceptance:cross-repo
        env:
          PRELUDE_ROOT: ${{ github.workspace }}/prelude
          PARTITA_ROOT: ${{ github.workspace }}/partita

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Pack package
        run: pnpm pack --pack-destination .npm-pack

      - name: Publish
        run: npm publish .npm-pack/*.tgz --access public --provenance
