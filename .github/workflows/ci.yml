name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify effect-harness
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22.22.1
      PNPM_VERSION: 10.33.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check out Craft skill source
        run: |
          craft_ref="$(node -p "JSON.parse(require('node:fs').readFileSync('repos/craft-skills.manifest.json', 'utf8')).source.ref")"
          git clone --filter=blob:none https://github.com/sayoriqwq/craft.git ../craft
          git -C ../craft checkout "$craft_ref"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify
