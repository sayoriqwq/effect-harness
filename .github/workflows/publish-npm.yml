name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm package version to publish, e.g. 0.1.0 or v0.1.0
        required: true
        type: string
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha
      dry_run:
        description: Run npm publish with --dry-run
        required: true
        default: false
        type: boolean
      provenance:
        description: Enable npm provenance metadata
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish effect-harness to npm
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22.22.1
      PNPM_VERSION: 10.33.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Check out Craft skill source
        run: |
          craft_ref="$(node -p "JSON.parse(require('node:fs').readFileSync('repos/craft-skills.manifest.json', 'utf8')).source.ref")"
          git clone --filter=blob:none https://github.com/sayoriqwq/craft.git ../craft
          git -C ../craft checkout "$craft_ref"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Enable npm trusted publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish package (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
          DRY_RUN: ${{ toJson(inputs.dry_run) }}
          NPM_PROVENANCE: ${{ toJson(inputs.provenance) }}
        run: pnpm publish:npm
